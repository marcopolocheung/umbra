name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Root TypeScript discovery includes server/* source files, so their
      # private dependencies must be present before the root typecheck.
      - run: npm --prefix server/shadow-prep ci
      - run: npm --prefix server/transit-prep ci

      - run: npm run lint

      # Fixture mode records the actual Node version. Node 24 is the supported
      # application runtime; see scripts/preflight-shadow-v2.mjs for the narrow
      # local Node 20+ fixture exception.
      - run: npm run preflight:shadow-v2:fixtures

      - run: npm run typecheck

      # These focused invocations are release gates as well as being covered by
      # `npm test` below. Keep the agreement corpus in normal Vitest discovery.
      - run: npx vitest run app/lib/shadowField/v2/__tests__/

      - run: npx vitest run app/lib/shadowField/__tests__/agreement/

      - run: npm test

      - run: npm run coverage

      # This is deliberately independent from root Vitest. It runs the
      # fail-closed NYC admission/preparation unit suite under Node 24.
      - run: npm --prefix server/shadow-prep test

      # Same reason: the GTFS pipeline's suite is hermetic (no network, no env)
      # but lives outside root Vitest discovery, so it needs its own step.
      - run: npm --prefix server/transit-prep test

      # No secrets needed: Vite inlines absent VITE_* vars as undefined, and the
      # MapTiler key is only read at runtime for tile fetches.
      - run: npm run build

      # Pinned Wrangler validates the NYC shadow-data sidecar without deploying
      # it: the generated Env types stay current, the full R2 API contract
      # typechecks under workerd types, and the bundle compiles. None of these
      # steps authenticate or upload anything.
      - run: npx -y wrangler@4.86.0 types --check
        working-directory: cloudflare/shadow-data-worker

      - run: npx tsc -p cloudflare/shadow-data-worker/tsconfig.json

      - run: npx -y wrangler@4.86.0 deploy --dry-run
        working-directory: cloudflare/shadow-data-worker

  e2e:
    name: browser smoke test
    needs: verify
    runs-on: ubuntu-latest
    # Above Playwright's own worst case, so a stuck run fails on the poll's
    # message rather than being killed by GitHub with nothing to say: two
    # projects x two attempts x the 240 s per-test ceiling is 16 min, plus the
    # build the webServer runs and the install steps.
    timeout-minutes: 25
    env:
      # Not required. The `smoke` project serves a synthetic basemap style, so it
      # runs everywhere including fork PRs, which never receive secrets. Where the
      # secret does exist it adds the `smoke-live` project, the only check that the
      # app still parses MapTiler's real building schema.
      VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Playwright builds and serves dist/ itself (see playwright.config.ts), and
      # prints which projects it is running. No artifact upload: `smoke-live`
      # traces record tile URLs, and those carry the key.
      - run: npm run e2e

      # Deliberately not `if: always()`. Saying which projects ran after a failed
      # run is the same shape of reassuring-but-untrue summary this job used to
      # print when it skipped everything.
      - run: |
          if [ -n "${VITE_MAPTILER_API_KEY}" ]; then
            echo "Ran \`smoke\` (fixture basemap) and \`smoke-live\` (real MapTiler tiles)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ran \`smoke\` (fixture basemap). \`smoke-live\` needs \`VITE_MAPTILER_API_KEY\`, which is unavailable here (fork PR, or the secret is unset)." >> "$GITHUB_STEP_SUMMARY"
          fi
