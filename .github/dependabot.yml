version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    # Version-locked by hard invariants in CLAUDE.md — do not let dependabot
    # propose these. The groups below only cover minor/patch, so without these
    # ignores a major bump still arrives as its own PR.
    ignore:
      # Invariant 2: suncalc 2.x is an ESM rewrite with named exports only (no
      # default), so `import SunCalc from "suncalc"` fails the build.
      - dependency-name: "suncalc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/suncalc"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "@biomejs/*"
          - "@tailwindcss/*"
          - "@types/*"
          - "@vitejs/*"
          - "tailwindcss"
          - "typescript"
          - "vite"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
