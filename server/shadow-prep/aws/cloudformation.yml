AWSTemplateFormatVersion: '2010-09-09'
Description: Private AWS Batch preparation infrastructure for Item 6 candidates (does not submit jobs).
Parameters:
  Name:
    Type: String
    Default: shademap-prep
    AllowedPattern: '^[a-z][a-z0-9-]{2,40}$'
  GitHubRepository:
    Type: String
    Description: Exact owner/repository allowed to publish the ECR image through OIDC.
  GitHubBranch:
    Type: String
    Default: main
  GitHubImmutableSubjectPrefix:
    Type: String
    Default: ''
    Description: Optional exact GitHub immutable OIDC subject prefix, as reported by GitHub's OIDC customization API.
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing private subnets with NAT/ECR/S3 access; this stack never creates public networking.
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing no-ingress security group for Batch instances.
  PrepImageTag:
    Type: String
    Default: bootstrap
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
    Description: Immutable ECR commit-SHA tag. Leave bootstrap only until the image-publish workflow has completed.
Conditions:
  HasGitHubImmutableSubjectPrefix: !Not [!Equals [!Ref GitHubImmutableSubjectPrefix, '']]
Resources:
  RawBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
  NormalizedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      # Candidate planes are private intermediate artifacts. Keep them long
      # enough for browser-pack verification, then clean them up automatically.
      LifecycleConfiguration:
        Rules:
          - Id: expire-private-candidates-after-30-days
            Status: Enabled
            Prefix: normalized/
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
          # The Overture lookup index is reproducible from raw sources and is
          # not part of the browser handoff, so retain its short disposal window.
          - Id: expire-reproducible-vector-index-after-7-days
            Status: Enabled
            Prefix: vector-index/
            ExpirationInDays: 7
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref Name
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration: { EncryptionType: AES256 }
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: batch.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole']
  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role']
  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref BatchInstanceRole] }
  BatchLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 200, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true }
  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        # AWS Batch calls On-Demand EC2 capacity "EC2"; "ON_DEMAND" is not
        # a valid ComputeResources.Type value.
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 4
        DesiredvCpus: 0
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        InstanceTypes: ['optimal']
        Subnets: !Ref PrivateSubnets
        SecurityGroupIds: [!Ref BatchSecurityGroup]
        LaunchTemplate: { LaunchTemplateId: !Ref BatchLaunchTemplate, Version: !GetAtt BatchLaunchTemplate.LatestVersionNumber }
  BatchQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder: [{ Order: 1, ComputeEnvironment: !Ref BatchComputeEnvironment }]
  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: admitted-inputs-and-candidates-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt RawBucket.Arn, !Sub '${RawBucket.Arn}/*']
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt NormalizedBucket.Arn, !Sub '${NormalizedBucket.Arn}/*', !GetAtt EvidenceBucket.Arn, !Sub '${EvidenceBucket.Arn}/*']
  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities: [EC2]
      RetryStrategy: { Attempts: 1 }
      Timeout: { AttemptDurationSeconds: 3600 }
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}:${PrepImageTag}'
        Vcpus: 4
        Memory: 15360
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        Command: ['server/shadow-prep/src/cli.ts', 'normalize', '--smoke']
        Environment:
          - { Name: SHADE_PREP_ROOT, Value: /scratch }
          - { Name: SHADE_PREP_RAW_BUCKET, Value: !Ref RawBucket }
          - { Name: SHADE_PREP_RAW_PREFIX, Value: '' }
          - { Name: SHADE_PREP_SCRATCH_MAX_BYTES, Value: '193273528320' }
          - { Name: SHADE_PREP_STORAGE, Value: s3 }
          - { Name: SHADE_PREP_S3_BUCKET, Value: !Ref NormalizedBucket }
          - { Name: SHADE_PREP_S3_PREFIX, Value: '' }
          - { Name: SHADE_PREP_EVIDENCE_BUCKET, Value: !Ref EvidenceBucket }
          - { Name: SHADE_PREP_EVIDENCE_PREFIX, Value: evidence }
        LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref BatchLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: prep } }
  BrowserPackSmokeJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities: [EC2]
      RetryStrategy: { Attempts: 1 }
      # The benchmark reads 36 representative tiles but writes nothing. The
      # timeout includes provisioning jitter without authorizing a runaway job.
      Timeout: { AttemptDurationSeconds: 1800 }
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}:${PrepImageTag}'
        Vcpus: 1
        Memory: 4096
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        Command:
          - server/shadow-prep/src/pack-cli.ts
          - --normalization-id
          - 70e3507f16d472adf5475b614a60cb16
          - --tiles
          - 18/77196/98516,18/77196/98517,18/77196/98518,18/77197/98516,18/77197/98517,18/77197/98518,18/77198/98516,18/77198/98517,18/77198/98518,18/77335/98545,18/77335/98546,18/77335/98547,18/77336/98545,18/77336/98546,18/77336/98547,18/77337/98545,18/77337/98546,18/77337/98547,18/77280/98428,18/77280/98429,18/77280/98430,18/77281/98428,18/77281/98429,18/77281/98430,18/77282/98428,18/77282/98429,18/77282/98430,18/77076/98687,18/77076/98688,18/77076/98689,18/77077/98687,18/77077/98688,18/77077/98689,18/77078/98687,18/77078/98688,18/77078/98689
          - --concurrency
          - '1'
        Environment:
          - { Name: SHADE_PREP_S3_BUCKET, Value: !Ref NormalizedBucket }
        LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref BatchLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: browser-pack-smoke } }
  BatchLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30 }
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  GitHubPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !GetAtt GitHubOidcProvider.Arn }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { 'token.actions.githubusercontent.com:aud': sts.amazonaws.com }
              StringLike:
                'token.actions.githubusercontent.com:sub': !If
                  - HasGitHubImmutableSubjectPrefix
                  - - !Sub 'repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
                    - !Sub 'repo:${GitHubRepository}:environment:aws-prep-publish'
                    - !Sub '${GitHubImmutableSubjectPrefix}:ref:refs/heads/${GitHubBranch}'
                    - !Sub '${GitHubImmutableSubjectPrefix}:environment:aws-prep-publish'
                  - - !Sub 'repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
                    - !Sub 'repo:${GitHubRepository}:environment:aws-prep-publish'
      Policies:
        - PolicyName: publish-only-this-repository
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:CompleteLayerUpload, ecr:InitiateLayerUpload, ecr:PutImage, ecr:UploadLayerPart]
                Resource: !GetAtt EcrRepository.Arn
Outputs:
  RawBucket: { Value: !Ref RawBucket }
  NormalizedBucket: { Value: !Ref NormalizedBucket }
  EvidenceBucket: { Value: !Ref EvidenceBucket }
  EcrRepositoryUri: { Value: !GetAtt EcrRepository.RepositoryUri }
  BatchQueue: { Value: !Ref BatchQueue }
  BatchJobDefinition: { Value: !Ref BatchJobDefinition }
  BrowserPackSmokeJobDefinition: { Value: !Ref BrowserPackSmokeJobDefinition }
  GitHubPublisherRoleArn: { Value: !GetAtt GitHubPublisherRole.Arn }
